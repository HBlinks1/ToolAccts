<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Tool Account</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1b2430; --muted: #5d6b7c; --line: #dfe5ec;
    --brand: #1f3864; --brand-text: #ffffff; --good: #1d7a46; --bad: #b3261e; --warn: #8a5a00;
    --field: #ffffff; --soft: #eef2f7; --shadow: 0 1px 3px rgba(20, 30, 50, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161d; --card: #1a222c; --text: #e8edf3; --muted: #9aa8b8; --line: #2b3745;
      --brand: #5b8def; --brand-text: #0c1219; --good: #52c487; --bad: #ff8a80; --warn: #f0b429;
      --field: #121921; --soft: #212c38; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .narrow { max-width: 420px; margin: 8vh auto 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 0 0 10px; } h3 { font-size: 16px; margin: 14px 0 8px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 1px; }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr; } @media (min-width: 640px) { .row.two { grid-template-columns: 1fr 1fr; } .row.three { grid-template-columns: 1fr 1fr 1fr; } }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 10px 14px; min-height: 44px; }
  button.primary { background: var(--brand); color: var(--brand-text); border-color: var(--brand); font-weight: 600; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.small { min-height: 34px; padding: 5px 10px; font-size: 14px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .full { width: 100%; margin-top: 16px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  .tabs button { white-space: nowrap; } .tabs button[aria-selected="true"] { background: var(--brand); color: var(--brand-text); border-color: var(--brand); font-weight: 600; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-text); border-color: var(--brand); font-weight: 600; }
  .alert { border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 15px; } .alert.err { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); border: 1px solid var(--bad); }
  .alert.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); border: 1px solid var(--good); } .alert.info { background: var(--soft); border: 1px solid var(--line); }
  .balance { font-size: 40px; font-weight: 700; letter-spacing: -.5px; } .pos { color: var(--good); } .neg { color: var(--bad); }
  .tablewrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 14px; } th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; } td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.edge td { font-weight: 700; background: var(--soft); } .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); }
  .pill.ok { color: var(--good); border-color: var(--good); } .pill.bad { color: var(--bad); border-color: var(--bad); } .pill.warn { color: var(--warn); border-color: var(--warn); }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; } .strip div { background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .strip b { display: block; font-size: 17px; } .modalback { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { background: var(--card); color: var(--text); border-radius: 12px; padding: 18px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; } .code { font: 700 34px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-align: center; padding: 14px; background: var(--soft); border-radius: 8px; margin: 12px 0; user-select: all; }
  a.link, button.link { background: none; border: 0; color: var(--brand); text-decoration: underline; padding: 6px 0; min-height: 0; cursor: pointer; }
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="wrap narrow"><p class="muted">Loading…</p></div></div>
<noscript><div class="wrap"><p>This page needs JavaScript to work.</p></div></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
